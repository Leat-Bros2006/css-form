<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0 16px;

            /* Background image (from Unsplash) + fallback color */
            background-color: #2a8fd6;
            background-image: url("https://www.shutterstock.com/image-photo/rough-sea-surface-continuous-whitewater-600nw-2737699127.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .form-container {
            width: 100%;
            max-width: 330px;
            margin-top: 30px;
            padding: 28px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        }

        .form-container h2 {
            text-align: center;
            font-size: 20px;
            color: #222;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #111;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 9px 10px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #ccd0d5;
            border-radius: 4px;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2fbf8f;
        }

        textarea {
            height: 64px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            font-size: 15px;
            color: #fff;
            background: #2fbf8f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #25a77c;
        }
    </style>
</head>

<body>

    <form class="form-container" action="#" method="post">
        <h2>Contact Us</h2>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>

</body>

</html>
